[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Async support
asyncio_mode = auto

# Environment setup
env =
    ENV=test
    PYTHONPATH=.

# Test marks
markers =
    integration: marks tests as integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    cache: tests related to location caching functionality
    osm: tests related to OpenStreetMap functionality

# Coverage configuration
addopts = 
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -v